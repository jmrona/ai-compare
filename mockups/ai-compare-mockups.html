          <p className="mt-2 text-[12px] text-dim">Iguales en los dos lados. La GPU de los modelos locales no se puede repartir.</p>
        </Panel>
        <Panel title="Modelos locales" right={<Chip>fase 2</Chip>}>
          <div className="flex gap-2"><Input id="loc-url" className="font-mono" disabled defaultValue="http://host.docker.internal:11434/v1" /><Button disabled>Probar</Button></div>
          <p className="mt-2 text-[12px] text-dim">Ollama, LM Studio, llama.cpp o vLLM en tu equipo. La lista de modelos sale del propio servidor.</p>
        </Panel>
        <Panel title="Versiones de los CLIs">
          <div className="grid gap-1.5 font-mono text-[12.5px]">
            {[['opencode', '1.9.2', '1.10.0'], ['codex', '—', null], ['claude', '—', null]].map(([c, v, n]) => (
              <div key={c} className="flex items-center justify-between rounded border border-line bg-term px-3 py-2">
                <span>{c}</span>{v === '—' ? <Chip>fase 2</Chip> : <span className="flex items-center gap-2 tnum">{v}<Button size="sm">Actualizar a {n}</Button></span>}
              </div>
            ))}
          </div>
        </Panel>
        <Panel title="Retención y disco" className="lg:col-span-2">
          <div className="grid gap-6 md:grid-cols-2">
            <div className="grid content-start gap-3">
              <label className="flex items-center gap-3 text-[13px]"><Switch id="ret-keep" checked={keep} onChange={setKeep} label="Conservar contenedores detenidos" />Conservar contenedores detenidos</label>
              <div className="grid grid-cols-3 gap-3">
                <Field label="Contenedores"><Input id="ret-c" className="tnum font-mono" defaultValue="7 días" disabled={!keep} /></Field>
                <Field label="Imágenes"><Input id="ret-i" className="tnum font-mono" defaultValue="14 días" /></Field>
                <Field label="Grabaciones"><Input id="ret-g" className="tnum font-mono" defaultValue="90 días" /></Field>
              </div>
              <div><Button size="sm" variant="danger"><Icon d={I.trash} className="h-3.5 w-3.5" />Limpiar ahora</Button></div>
            </div>
            <div className="grid content-start gap-2 font-mono text-[12.5px]">
              {[['imágenes', 14.2], ['contenedores detenidos', 7.1], ['artefactos e informes', 2.9], ['base de datos', 0.4]].map(([l, v]) => (
                <div key={l}>
                  <div className="flex justify-between"><span className="text-muted">{l}</span><span className="tnum">{v.toFixed(1).replace('.', ',')} GB</span></div>
                  <div className="mt-1 h-1 rounded bg-raise"><div className="h-1 rounded bg-fg/70" style={{ width: (v / 24.6 * 100) + '%' }} /></div>
                </div>
              ))}
              <div className="mt-1 flex justify-between border-t border-line pt-2"><span className="text-muted">total</span><span className="tnum">24,6 GB</span></div>
            </div>
          </div>
        </Panel>
      </div>
    </>
  );
}

/* ───────────── app ───────────── */

function App() {
  const [page, setPage] = useState(() => { const h = (location.hash || '').slice(1); return NAV.some(n => n[0] === h) ? h : 'compare'; });
  const [historyView, setHistoryView] = useState('list');
  const [harnessView, setHarnessView] = useState('list');
  const go = (p, sub) => {
    setPage(p);
    if (p === 'history') setHistoryView(sub || 'list');
    if (p === 'harnesses') setHarnessView(sub || 'list');
    window.scrollTo(0, 0);
  };
  return (
    <div className="grid min-h-screen grid-rows-[auto_1fr] sm:grid-cols-[64px_minmax(0,1fr)] sm:grid-rows-1">
      <nav aria-label="Navegación" className="flex items-center gap-1 overflow-x-auto border-b border-line bg-bg px-2 py-1.5 sm:sticky sm:top-0 sm:h-screen sm:flex-col sm:border-b-0 sm:border-r sm:px-0 sm:py-3">
        <button onClick={() => go('compare')} className="mr-2 flex h-6 w-6 shrink-0 overflow-hidden rounded sm:mb-4 sm:mr-0" aria-label="ai-compare"><span className="w-1/2 bg-sidea" /><span className="w-1/2 bg-sideb" /></button>
        {NAV.map(([k, label, d]) => (
          <button key={k} onClick={() => go(k)} title={label}
            className={cn('flex shrink-0 flex-col items-center gap-0.5 rounded px-2 py-1.5 text-[10px] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sidea/60 sm:w-[52px]',
              page === k ? 'bg-raise text-fg' : 'text-muted hover:text-fg')}>
            <Icon d={d} className="h-[17px] w-[17px]" />{label}
          </button>
        ))}
      </nav>
      <div className="flex min-h-screen min-w-0 flex-col">
        <main className="min-w-0 flex-1">
          {page === 'compare' && <ComparePage go={go} />}
          {page === 'history' && <HistoryPage view={historyView} setView={setHistoryView} go={go} />}
          {page === 'harnesses' && <HarnessesPage view={harnessView} setView={setHarnessView} />}
          {page === 'pricing' && <PricingPage />}
          {page === 'settings' && <SettingsPage />}
        </main>
        <StatusBar />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
